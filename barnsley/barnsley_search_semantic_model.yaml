dataset:
  name: barnsley_search
  description: >
    This dataset includes records of people attending a community hub and the advice or signposting they received. It includes information about the person, their wellbeing, experience of the visit and the advice or signposting given. It also includes the user ID and name of the person who recorded the visit.

tables:
  ai_search_requests:
    description: This table contains ai search requests from the barnsley search tool. It includes the response to the search, time taken to respond and some more useful fields.
    primary_key: id

    columns:
      id:
        type: integer
        description: Unique search ID

      created_at:
        type: datetime
        description: Timestamp for when the visit record was created.

        org_name:
        type: 
        description: 

        search_request:
        type: text
        description: The actual search request from a user of the search tool. This could be anything a person wants to know about within the barnsley family hubs website.

        search_response:
        type: text
        description: The AI response to the search request. 

        time_taken:
        type: integer
        description: Time taken between the search request and search request response.

        query_type:
        type: text
        description: Type of query. All at current are 'search'

        org_id:
        type: uuid
        description: Organisation id
        

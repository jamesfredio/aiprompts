dataset:
  name: token_logging
  description: >
    Contains token usage data for AI operations executed within n8n workflows.
    The dataset records every OpenAI Responses API call, including the workflow,
    operation performed, user question, model used, and the number of input,
    output and total tokens consumed.

tables:
  view_workflow_token_logging:
    description: >
      Contains token usage logs for AI operations performed within an n8n
      workflow. Each row represents a single OpenAI Responses API call, not a
      workflow execution. A single workflow execution typically generates three
      rows representing the SQL generation, visual recommendation and data
      summary operations.

      The table records the workflow execution identifier, workflow identifier,
      execution date, AI operation performed, original user question, model
      used, and the number of input, output and total tokens consumed. This
      table is intended for analysing AI usage, token consumption, estimated
      costs, execution trends and comparing token usage between AI operations
      or workflows over time.

    primary_key: id

    semantic_notes: |
      - Each row represents one OpenAI Responses API call.
      - A workflow execution typically consists of three AI operations.
      - Multiple rows can share the same workflow_execution_id.
      - Sum total_tokens grouped by workflow_execution_id to calculate the total token usage for a workflow execution.
      - Use ai_operation to analyse individual stages of the workflow.

    columns:
      id:
        type: integer
        description: Unique identifier for each token log record.

      workflow_execution_id:
        type: integer
        description: >
          Identifier of the n8n workflow execution. Multiple rows can share
          this value because one workflow execution may perform multiple AI
          operations. Group by this field when analysing workflow executions.

      workflow_id:
        type: string
        description: Identifier of the n8n workflow that generated the AI requests.

      date:
        type: date
        description: Date on which the AI operation was executed.

      ai_operation:
        type: string
        description: >
          The AI task performed. Common values include 'get sql',
          'visual recommendation' and 'data summary of summary query'.

      user_message:
        type: string
        description: The original natural language question submitted by the user.

      input_tokens:
        type: integer
        description: Number of prompt tokens sent to the model.

      output_tokens:
        type: integer
        description: Number of completion tokens returned by the model.

      total_tokens:
        type: integer
        description: Total tokens consumed for the API call (input_tokens + output_tokens).

      model:
        type: string
        description: OpenAI model used for the AI operation, for example gpt-4.1-mini-2025-04-14.

      workflow_name:
      type: string
      description: The actual name of the n8n workflow.

      active:
      type: boolean
      description: True or false result for whether the workflow is defined ad active.

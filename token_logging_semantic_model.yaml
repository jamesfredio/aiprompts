dataset:
  name: token_logging
  description: >
    The table includes rows of executions from an n8n workflow which includes 3 openAI response api calls. It lists input, output, total tokens as well as other key information. 

tables:
  workflow_token_logging:
    description: Contains token usage logs for AI operations performed within an n8n workflow.
  Each row represents a single OpenAI Responses API call made during a workflow
  execution, rather than the workflow execution itself. A typical workflow
  execution generates multiple rows (currently three), representing different AI
  operations such as SQL generation, visual recommendation, and data summary.

  The table records the workflow execution identifier, workflow identifier,
  execution date, AI operation performed, original user question, model used,
  and the number of input, output, and total tokens consumed. This table is
  intended for analysing AI usage, token consumption, model performance,
  workflow costs, execution trends, and comparing token usage between different
  AI operations or workflows over time.
    primary_key: id

columns:
  id:
    type: integer
    description: Unique identifier for each token log record.

  workflow_execution_id:
    type: integer
    description: Identifier of the n8n workflow execution. Multiple rows can share this value because one workflow execution may perform multiple AI operations.

  workflow_id:
    type: string
    description: Identifier of the n8n workflow that generated the AI request.

  date:
    type: date
    description: Date on which the AI operation occurred.

  ai_operation:
    type: string
    description: The AI task performed, such as 'get sql', 'visual recommendation', or 'data summary of summary query'.

  user_message:
    type: string
    description: The original natural language question submitted by the user.

  input_tokens:
    type: integer
    description: Number of prompt tokens sent to the model.

  output_tokens:
    type: integer
    description: Number of completion tokens returned by the model.

  total_tokens:
    type: integer
    description: Total tokens consumed for the API call (input_tokens + output_tokens).

  model:
    type: string
    description: The OpenAI model used to perform the AI operation, for example gpt-4.1-mini-2025-04-14.
